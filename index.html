<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabio Scrive</title>
<style>
/* Stili originali mantenuti */
:root { --gold: #c9a84c; --stone: #1a1714; --cream: #f2ead8; --text-body: #c8bfa8; }
body { background: var(--stone); color: var(--text-body); font-family: 'Cormorant Garamond', serif; text-align:center; padding: 50px; }
.post-card { background: #2c2720; padding: 20px; margin: 10px auto; max-width: 600px; border-left: 3px solid var(--gold); text-align: left; }
</style>
</head>
<body>
    <h1 style="color:var(--gold); font-family: 'Bebas Neue';">FABIO SCRIVE</h1>
    <div id="content-area">Caricamento contenuti da GitHub...</div>

<script>
async function loadData() {
    // MODIFICA QUESTI DUE VALORI
    const GITHUB_USER = "IL_TUO_USERNAME"; 
    const GITHUB_REPO = "IL_NOME_REPO";
    
    const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;

    try {
        const res = await fetch(url + '?v=' + Date.now());
        if(!res.ok) throw new Error("File non trovato");
        const data = await res.json();
        
        render(data);
    } catch(e) {
        document.getElementById('content-area').innerHTML = "Errore nel caricamento dei dati. Assicurati che data.json sia pubblico su GitHub.";
    }
}

function render(data) {
    const area = document.getElementById('content-area');
    area.innerHTML = "<h2>Ultimi Post</h2>";
    data.posts.forEach(p => {
        area.innerHTML += `<div class="post-card"><h3>${p.title}</h3><p>${p.date}</p></div>`;
    });
}

loadData();
</script>
</body>
</html>
