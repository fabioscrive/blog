<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabio Scrive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold: #c9a84c; --gold-light: #e8d08a; --gold-dark: #8a6820;
  --stone: #1a1714; --stone-mid: #2c2720; --stone-light: #3d3730;
  --cream: #f2ead8; --cream-dark: #d4c9a8; --text-body: #c8bfa8;
}
html { scroll-behavior: smooth; }
body { background: var(--stone); color: var(--text-body); font-family: 'Cormorant Garamond', serif; font-size: 17px; line-height: 1.7; }

/* ── HEADER ── */
.site-header {
  background: var(--stone-mid); border-bottom: 2px solid var(--gold-dark);
  text-align: center; padding: 48px 24px 36px;
}
.site-title {
  font-family: 'Bebas Neue', sans-serif; font-size: clamp(48px, 8vw, 90px);
  color: var(--gold); letter-spacing: 0.12em; line-height: 1;
}
.site-subtitle {
  font-family: 'Cormorant Garamond', serif; font-style: italic;
  font-size: 18px; color: var(--cream-dark); margin-top: 8px;
}

/* ── LAYOUT ── */
.site-body { max-width: 1100px; margin: 0 auto; padding: 48px 24px; display: grid; grid-template-columns: 1fr 300px; gap: 48px; }
@media (max-width: 860px) { .site-body { grid-template-columns: 1fr; } .sidebar { order: -1; } }

/* ── POST GRID ── */
.posts-grid { display: grid; gap: 32px; }
.post-card {
  background: var(--stone-mid); border: 1px solid var(--stone-light);
  cursor: pointer; transition: border-color .2s, transform .2s;
  overflow: hidden;
}
.post-card:hover { border-color: var(--gold-dark); transform: translateY(-2px); }
.post-card-img { width: 100%; height: 200px; object-fit: cover; display: block; }
.post-card-img-placeholder { width: 100%; height: 120px; background: var(--stone-light); display: flex; align-items: center; justify-content: center; font-size: 32px; color: var(--gold-dark); }
.post-card-body { padding: 24px; }
.post-card-cat { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 0.3em; color: var(--gold-dark); margin-bottom: 8px; }
.post-card-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--cream); font-weight: 700; line-height: 1.3; margin-bottom: 10px; }
.post-card-date { font-size: 13px; color: var(--text-body); font-style: italic; }
.post-card-excerpt { margin-top: 12px; font-size: 15px; color: var(--text-body); line-height: 1.65; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar { display: flex; flex-direction: column; gap: 32px; }
.sidebar-card { background: var(--stone-mid); border: 1px solid var(--stone-light); padding: 28px; }
.sidebar-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 0.3em; color: var(--gold-dark); margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--stone-light); }
.author-photo { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 16px; border: 2px solid var(--gold-dark); }
.author-name { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--cream); text-align: center; font-style: italic; margin-bottom: 10px; }
.author-bio { font-size: 15px; line-height: 1.7; text-align: center; }

/* Book in sidebar */
.book-item { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.book-item:last-child { margin-bottom: 0; }
.book-cover { width: 56px; height: 78px; object-fit: cover; border: 1px solid var(--stone-light); flex-shrink: 0; }
.book-cover-ph { width: 56px; height: 78px; background: var(--stone-light); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--gold-dark); }
.book-info-title { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--cream); font-weight: 700; line-height: 1.3; margin-bottom: 4px; }
.book-buy-link { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 0.15em; color: var(--gold-dark); text-decoration: none; }
.book-buy-link:hover { color: var(--gold); }

/* ── POST MODAL ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 200; overflow-y: auto; padding: 40px 20px;
}
.modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }
.modal-box {
  background: var(--stone-mid); border: 1px solid var(--stone-light);
  max-width: 760px; width: 100%; padding: 0; overflow: hidden;
}
.modal-cover { width: 100%; max-height: 380px; object-fit: cover; display: block; }
.modal-body { padding: 40px; }
.modal-cat { font-family: 'Bebas Neue', sans-serif; font-size: 11px; letter-spacing: 0.3em; color: var(--gold-dark); margin-bottom: 12px; }
.modal-title { font-family: 'Playfair Display', serif; font-size: 34px; color: var(--cream); font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
.modal-date { font-size: 14px; font-style: italic; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--stone-light); }
.modal-content { font-size: 18px; line-height: 1.85; }
.modal-content p { margin-bottom: 18px; }
.modal-content h2 { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--cream); margin: 28px 0 14px; }
.modal-content h3 { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--cream); margin: 24px 0 12px; }
.modal-content blockquote { border-left: 2px solid var(--gold-dark); padding-left: 20px; font-style: italic; color: var(--cream-dark); margin: 20px 0; }
.modal-content strong { color: var(--cream); }
.modal-content a { color: var(--gold-dark); }
.modal-photos { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.modal-photos img { width: 160px; height: 120px; object-fit: cover; border: 1px solid var(--stone-light); cursor: zoom-in; }
.modal-close {
  position: sticky; top: 0; float: right;
  font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 0.2em;
  padding: 10px 20px; background: var(--stone); border: 1px solid var(--stone-light);
  color: var(--text-body); cursor: pointer; margin: 16px 16px 0 0;
}
.modal-close:hover { border-color: var(--gold-dark); color: var(--gold); }

/* ── LOADING / ERROR ── */
.loading-msg { text-align: center; padding: 60px 20px; font-style: italic; font-size: 18px; color: var(--text-body); }
.error-msg { text-align: center; padding: 60px 20px; color: #e07070; font-size: 16px; }
.error-msg code { display: block; margin-top: 12px; font-size: 13px; color: var(--gold-dark); background: var(--stone-light); padding: 10px 16px; text-align: left; max-width: 600px; margin-inline: auto; }

/* ── NO POSTS ── */
.empty-msg { text-align: center; padding: 40px; font-style: italic; color: var(--text-body); }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">FABIO SCRIVE</div>
  <div class="site-subtitle" id="header-subtitle">Storie, pensieri e il mestiere del narratore</div>
</header>

<div class="site-body">
  <!-- POSTS -->
  <main>
    <div id="posts-area">
      <div class="loading-msg">Caricamento contenuti…</div>
    </div>
  </main>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-card" id="author-card" style="display:none;">
      <div class="sidebar-card-title">L'AUTORE</div>
      <div id="author-content"></div>
    </div>
    <div class="sidebar-card" id="books-card" style="display:none;">
      <div class="sidebar-card-title">I MIEI LIBRI</div>
      <div id="books-content"></div>
    </div>
  </aside>
</div>

<!-- POST MODAL -->
<div class="modal-overlay" id="post-modal" onclick="handleModalClick(event)">
  <div class="modal-box" id="modal-box">
    <button class="modal-close" onclick="closeModal()">✕ Chiudi</button>
    <div id="modal-inner"></div>
  </div>
</div>

<script>
// ── CONFIGURAZIONE ──
// Modifica solo questi due valori con il tuo username e nome repository GitHub
const GITHUB_USER = "IL_TUO_USERNAME";
const GITHUB_REPO = "IL_NOME_REPO";
// ────────────────────

const DATA_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/data.json`;

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
}

function getExcerpt(html, maxChars = 160) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  const text = tmp.textContent || tmp.innerText || '';
  return text.length > maxChars ? text.substring(0, maxChars).trimEnd() + '…' : text;
}

async function loadData() {
  try {
    const res = await fetch(DATA_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error(`HTTP ${res.status} – assicurati che data.json sia pubblico e che GITHUB_USER/GITHUB_REPO siano corretti.`);
    const data = await res.json();
    render(data);
  } catch(e) {
    document.getElementById('posts-area').innerHTML = `
      <div class="error-msg">
        <strong>Errore nel caricamento dei contenuti.</strong><br>
        Controlla che il repository sia pubblico e che i parametri siano corretti in index.html.
        <code>${e.message}</code>
      </div>`;
  }
}

function render(data) {
  renderAuthor(data.author);
  renderBooks(data.books || []);
  renderPosts(data.posts || []);
}

function renderAuthor(author) {
  if (!author || !author.name) return;
  const card = document.getElementById('author-card');
  const content = document.getElementById('author-content');
  let html = '';
  if (author.photo) {
    html += `<img src="${author.photo}" alt="${author.name}" class="author-photo" onerror="this.style.display='none'">`;
  }
  html += `<div class="author-name">${author.name}</div>`;
  if (author.bio) html += `<p class="author-bio">${author.bio}</p>`;
  content.innerHTML = html;
  card.style.display = '';
}

function renderBooks(books) {
  if (!books.length) return;
  const card = document.getElementById('books-card');
  const content = document.getElementById('books-content');
  content.innerHTML = books.map(b => {
    const cover = b.coverImg
      ? `<img src="${b.coverImg}" alt="${b.title}" class="book-cover" onerror="this.style.display='none'">`
      : `<div class="book-cover-ph">📖</div>`;
    const link = b.buyLink
      ? `<a href="${b.buyLink}" target="_blank" class="book-buy-link">Acquista ↗</a>`
      : '';
    return `<div class="book-item">${cover}<div><div class="book-info-title">${b.title}</div>${link}</div></div>`;
  }).join('');
  card.style.display = '';
}

function renderPosts(posts) {
  const area = document.getElementById('posts-area');
  const published = posts.filter(p => p.published !== false);
  if (!published.length) {
    area.innerHTML = '<div class="empty-msg">Nessun articolo pubblicato ancora.</div>';
    return;
  }
  area.innerHTML = `<div class="posts-grid">${published.map(p => {
    const cover = p.coverImg
      ? `<img src="${p.coverImg}" alt="" class="post-card-img" onerror="this.style.display='none'">`
      : `<div class="post-card-img-placeholder">✍</div>`;
    return `<article class="post-card" onclick="openPost('${p.id}')" data-id="${p.id}">
      ${cover}
      <div class="post-card-body">
        ${p.category ? `<div class="post-card-cat">${p.category}</div>` : ''}
        <h2 class="post-card-title">${p.title}</h2>
        <div class="post-card-date">${formatDate(p.date)}</div>
        <p class="post-card-excerpt">${getExcerpt(p.body)}</p>
      </div>
    </article>`;
  }).join('')}</div>`;
  window._postsData = posts;
}

function openPost(id) {
  const post = (window._postsData || []).find(p => p.id === id);
  if (!post) return;
  const cover = post.coverImg
    ? `<img src="${post.coverImg}" alt="" class="modal-cover" onerror="this.style.display='none'">`
    : '';
  const extraPhotos = (post.photos || []).slice(1);
  const gallery = extraPhotos.length
    ? `<div class="modal-photos">${extraPhotos.map(src => `<img src="${src}" onerror="this.style.display='none'">`).join('')}</div>`
    : '';
  document.getElementById('modal-inner').innerHTML = `
    ${cover}
    <div class="modal-body">
      ${post.category ? `<div class="modal-cat">${post.category}</div>` : ''}
      <h1 class="modal-title">${post.title}</h1>
      <div class="modal-date">${formatDate(post.date)}</div>
      <div class="modal-content">${post.body || ''}</div>
      ${gallery}
    </div>`;
  document.getElementById('post-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('post-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function handleModalClick(e) {
  if (e.target === document.getElementById('post-modal')) closeModal();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

loadData();
</script>
</body>
</html>
